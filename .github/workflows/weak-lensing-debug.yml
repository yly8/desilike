name: weak-lensing-cpu-regression
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        repetition: [1, 2]
        python: ['3.12', '3.14']
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/cache@v4
        with:
          path: |
            wheelhouse
            ~/.cache/pip
          key: Linux-pip-${{ matrix.python }}-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: Linux-pip-${{ matrix.python }}-
      - name: Install CI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libopenmpi-dev
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install pytest pytest-cov pytest-timeout
          mkdir -p wheelhouse
          if ! ls wheelhouse/pyclass-*.whl > /dev/null 2>&1; then
            pip wheel -w wheelhouse git+https://github.com/adematti/pyclass
          fi
          python -m pip install --no-index --find-links=wheelhouse pyclass
          python -m pip install .[tests]
      - name: Verify single and sampler-batched likelihoods
        run: |
          # Exercise the ordinary pytest path, without diagnostic monkeypatches
          # or periodic stack dumping, and with native XLA threading enabled.
          unset XLA_FLAGS
          python -m pytest -v --cov=desilike --cov-report= --durations=10 \
            --timeout=300 --timeout-method=thread \
            desilike/likelihoods/weak_lensing/tests/test_des_y3.py
