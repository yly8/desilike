name: weak-lensing-debug
on:
  workflow_dispatch:
  push:
    branches: [refactor-jax-des]
    paths: [.github/workflows/weak-lensing-debug.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        mode: [isolated, isolated-omp, isolated-blas, isolated-one-thread]
    env:
      WL_PROBE_MODE: ${{ matrix.mode }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: |
            wheelhouse
            ~/.cache/pip
          key: Linux-pip-3.12-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: Linux-pip-3.12-
      - name: Install CI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libopenmpi-dev
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install pytest pytest-cov pytest-timeout
          mkdir -p wheelhouse
          if ! ls wheelhouse/pyclass-*.whl > /dev/null 2>&1; then
            pip wheel -w wheelhouse git+https://github.com/adematti/pyclass
          fi
          python -m pip install --no-index --find-links=wheelhouse pyclass
          python -m pip install .[tests]
      - name: Probe JIT stages and callbacks
        run: |
          if [ "$WL_PROBE_MODE" = isolated-omp ]; then
            export OMP_NUM_THREADS=1
          elif [ "$WL_PROBE_MODE" = isolated-blas ]; then
            export OPENBLAS_NUM_THREADS=1 MKL_NUM_THREADS=1
          elif [ "$WL_PROBE_MODE" = isolated-one-thread ]; then
            export OMP_NUM_THREADS=1 OPENBLAS_NUM_THREADS=1 MKL_NUM_THREADS=1
          fi
          python -m desilike.likelihoods.weak_lensing.tests.diagnose_ci
